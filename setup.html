<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Roomie – Set Up Profile</title>
  <meta name="theme-color" content="#0d0f14"/>

  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Roomie"/>

  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json"/>

  <style>
    .select-wrap{position:relative;}
    .select-wrap select{appearance:none;-webkit-appearance:none;padding-right:40px;cursor:pointer;}
    .select-wrap::after{
      content:'';position:absolute;right:14px;top:50%;
      transform:translateY(-50%);
      border:5px solid transparent;
      border-top-color:var(--muted);
      margin-top:3px;pointer-events:none;
    }
    .photo-circle{
      width:72px;height:72px;border-radius:50%;
      background:var(--card);border:2px dashed var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:1.8rem;overflow:hidden;flex-shrink:0;cursor:pointer;
    }
    .photo-circle img{width:100%;height:100%;object-fit:cover;}
    .currency-preview{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(255,107,53,.1);
      color:var(--accent);
      border:1px solid rgba(255,107,53,.3);
      border-radius:8px;
      padding:6px 12px;
      font-size:13px;
      font-weight:600;
      margin-top:6px;
    }
  </style>
</head>

<body>

<script type="module" src="theme.js"></script>

<div class="page-full">
<div style="max-width:480px;margin:0 auto;width:100%;padding-bottom:40px">

  <div style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:4px">
    One last step 🎉
  </div>
  <p style="color:var(--muted);font-size:14px;margin-bottom:28px">
    Set up your profile so students near you can find you.
  </p>

  <!-- PROFILE PHOTO -->
  <div class="form-group">
    <label>Profile photo <span style="color:var(--muted)">(optional)</span></label>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="photo-circle" id="photo-circle" onclick="document.getElementById('photo-file').click()">👤</div>
      <div>
        <label for="photo-file" style="display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px;font-weight:500;">
          📷 Choose photo
        </label>
        <input type="file" id="photo-file" accept="image/*" style="display:none" onchange="handlePhoto(this)"/>
        <p class="form-hint" id="photo-status" style="margin-top:6px">Tap to upload</p>
      </div>
    </div>
    <input type="hidden" id="photoURL"/>
  </div>

  <div class="form-group">
    <label>Full name *</label>
    <input type="text" id="name" placeholder="e.g. Emeka Johnson"/>
  </div>

  <!-- COUNTRY -->
  <div class="form-group">
    <label>Country *</label>
    <div class="select-wrap">
      <select id="country" onchange="onCountryChange()">
        <option value="">— Select your country —</option>
      </select>
    </div>
  </div>

  <!-- UNIVERSITY -->
  <div class="form-group" id="uni-group" style="display:none">
    <label>University *</label>
    <div class="select-wrap" id="uni-select-wrap">
      <select id="uni-select" onchange="onUniChange()"></select>
    </div>
    <input type="text" id="uni-other" style="display:none;margin-top:8px"/>
  </div>

  <div class="form-group">
    <label>City / State *</label>
    <input type="text" id="city"/>
  </div>

  <div class="form-group">
    <label>Phone (optional)</label>
    <input type="tel" id="phone"/>
  </div>

  <div class="form-group">
    <label>Course (optional)</label>
    <input type="text" id="course"/>
  </div>

  <div class="form-group">
    <label>Year (optional)</label>
    <select id="year">
      <option value="">Select year</option>
      <option>1st year</option>
      <option>2nd year</option>
      <option>3rd year</option>
      <option>4th year</option>
      <option>Postgraduate</option>
    </select>
  </div>

  <!-- ✅ REFERRAL INPUT ADDED HERE -->
  <div class="form-group" id="referral-group">
    <label>Referral code <span style="color:var(--muted)">(optional)</span></label>
    <input type="text" id="referral-code" placeholder="e.g. EMEK1234"
      style="text-transform:uppercase;letter-spacing:2px"/>
    <p class="form-hint" id="referral-hint" style="margin-top:6px"></p>
  </div>

  <p id="error-msg" style="display:none;color:var(--danger)"></p>

  <button class="btn btn-primary" id="save-btn" onclick="handleSave()">
    Save & Continue →
  </button>

</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  collection,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { uploadImage } from './upload.js';

const app = initializeApp({
  apiKey:"AIzaSyDaDEbVpUUyLsmq5ilNp3CVLRs3ZX-ZWUM",
  authDomain:"roomie-f3103.firebaseapp.com",
  projectId:"roomie-f3103",
  storageBucket:"roomie-f3103.firebasestorage.app",
  messagingSenderId:"896474185176",
  appId:"1:896474185176:web:0e4543682f594daf0a86ad"
});

const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, u => {
  if (!u) location.href = 'login.html';
});

function generateReferralCode(name='') {
  const base = name.replace(/\s/g,'').toUpperCase().slice(0,4);
  return `${base || 'USER'}${Math.floor(1000 + Math.random()*9000)}`;
}

// apply referral
async function applyReferral(code, newUid) {
  const snap = await getDocs(collection(db,'users'));

  let owner = null;

  snap.forEach(d => {
    const data = d.data();
    if (data.referralCode === code) owner = { id:d.id, ...data };
  });

  if (!owner) throw new Error("Invalid referral code");
  if (owner.id === newUid) throw new Error("Cannot refer yourself");

  await updateDoc(doc(db,'users',owner.id), {
    referralCount: (owner.referralCount||0)+1,
    referralEarnings: (owner.referralEarnings||0)+200
  });

  await addDoc(collection(db,'referrals'), {
    referrer: owner.id,
    referred: newUid,
    code,
    createdAt: serverTimestamp()
  });
}

window.handleSave = async () => {
  const u = auth.currentUser;
  if (!u) return;

  const name = document.getElementById('name').value.trim();
  const country = document.getElementById('country').value;
  const city = document.getElementById('city').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const course = document.getElementById('course').value.trim();
  const year = document.getElementById('year').value;
  const photoURL = document.getElementById('photoURL').value.trim();
  const refInput = (document.getElementById('referral-code').value||'').trim().toUpperCase();

  if (!name || !country || !city) return;

  const existing = await getDoc(doc(db,'users',u.uid));
  const old = existing.exists() ? existing.data() : {};

  const myCode = old.referralCode || generateReferralCode(name);

  const data = {
    ...old,
    uid: u.uid,
    email: u.email,
    name,
    country,
    city,
    phone,
    course,
    year,
    photoURL,
    referralCode: myCode,
    referralCount: old.referralCount || 0,
    referralEarnings: old.referralEarnings || 0,
    createdAt: old.createdAt || new Date().toISOString()
  };

  await setDoc(doc(db,'users',u.uid), data);

  // apply referral if entered
  if (refInput) {
    try {
      await applyReferral(refInput, u.uid);
      document.getElementById('referral-hint').textContent =
        "Referral applied ✅";
    } catch (e) {
      document.getElementById('error-msg').style.display='block';
      document.getElementById('error-msg').textContent = e.message;
    }
  }

  location.href = "home.html";
};

// photo upload
window.handlePhoto = async (input) => {
  const file = input.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  document.getElementById('photo-circle').innerHTML = `<img src="${url}"/>`;

  const final = await uploadImage(file);
  document.getElementById('photoURL').value = final;
};
</script>
</body>
    </html>
